name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        working-directory: astra/frontend
        run: |
          node scripts/generate-release-metadata.js
          echo "## Astra AI ${{ steps.version.outputs.version }}" > release-notes.md
          {
            echo ""
            echo "### Included"
            echo "- Software update service (electron-updater, stable/beta channels)"
            echo "- Structured release logging and enriched crash logs"
            echo "- Production build with per-route code splitting"
            echo ""
            echo "### Installers"
            echo "- Windows: NSIS + Portable (x64)"
            echo "- macOS: DMG (x64 + arm64)"
            echo "- Linux: AppImage + DEB (x64)"
          } >> release-notes.md

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Astra AI ${{ steps.version.outputs.version }}
          body_path: astra/frontend/release-notes.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true

  attach-artifacts:
    name: Attach artifacts (${{ matrix.os }})
    needs: draft-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: astra/frontend/package-lock.json

      - name: Install dependencies
        working-directory: astra/frontend
        run: npm ci

      - name: Build & package
        working-directory: astra/frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npm run release:metadata
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx electron-builder --win --x64
          elif [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder --mac --x64 --arm64
          else
            npx electron-builder --linux --x64
          fi

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            astra/frontend/release/*.exe
            astra/frontend/release/*.dmg
            astra/frontend/release/*.AppImage
            astra/frontend/release/*.deb
            astra/frontend/release/*.blockmap
            astra/frontend/release/*.yml

