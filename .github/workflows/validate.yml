name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: astra/frontend

jobs:
  validate:
    name: TypeScript / ESLint / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: astra/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Generate release metadata
        run: npm run release:metadata

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: astra/frontend/dist
          if-no-files-found: error

