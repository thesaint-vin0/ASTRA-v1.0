name: Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  package:
    name: Package (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            build_cmd: npx electron-builder --win --x64
            artifact_dir: backend
            artifact_glob: release/**/*.exe
            artifact_name: astra-windows
          - os: macos-latest
            build_cmd: npx electron-builder --mac --x64 --arm64
            artifact_dir: backend
            artifact_glob: release/**/*.dmg
            artifact_name: astra-macos
          - os: ubuntu-latest
            build_cmd: npx electron-builder --linux --x64
            artifact_dir: backend
            artifact_glob: release/**/*.{AppImage,deb}
            artifact_name: astra-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: astra/frontend/package-lock.json

      - name: Install dependencies
        working-directory: astra/frontend
        run: npm ci

      - name: Build & Package
        working-directory: astra/frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npm run release:metadata
          ${{ matrix.build_cmd }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: astra/frontend/release
          if-no-files-found: error

